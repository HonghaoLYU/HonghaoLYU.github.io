name: Sync Publications to HTML

on:
  push:
    paths:
      - 'data/publications.tex'
      - 'data/patents.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate publication & patent HTML
        run: python scripts/gen_publications.py

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-sync publications/patents from tex [skip ci]"
          git push
